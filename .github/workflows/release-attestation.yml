# aegis-trust release-attestation workflow (Block B)
#
# Sprint: productization-ops/sprint_009 T-009-1
# PR: operational-trust-review Batch 1 P1 `supply_chain_attestation` closure
# Closes: cso_review (P0 partial_closure) の唯一の dependency
#
# === SAFETY INVARIANTS (must hold) ===
#
#   1. Trigger は workflow_dispatch (manual) または tag push (`v*`) のみ。
#      pull_request_target を **使わない** (token theft 攻撃面)。
#   2. permissions に `id-token: write` を持つ — Sigstore keyless signing (cosign)
#      と GitHub native build provenance (actions/attest-build-provenance) のため。
#      Block A の ci.yml と完全分離 (ci.yml は read-only contract)。
#   3. Secrets (NPM_TOKEN / PYPI_TOKEN) は本 workflow は **使わない**。 npm publish は
#      **Block C で npm Trusted Publisher OIDC** 経由 (token なし、 id-token: write OIDC、
#      npm ≥11.5.1 で literal supported)。 PyPI publish は **将来 Trusted Publisher**
#      経由 (本 file line 245 follow-up)、 現状 PyPI 側は manual twine + ~/.pypirc 経由
#      (本 workflow は触らない)。 outputs = SBOM + attestation + release artifact attach
#      + npm tag-push-only publish (Block C)。
#   4. 全 third-party action は 40-char commit SHA pin。 tag pin 禁止 (mutation attack)。
#   5. Runner = **self-hosted aegis-mac mandatory** (Block B = release-class、 supply
#      chain trust の核心)。 ubuntu-latest = GitHub-hosted は禁止 (= cosign keyless OIDC
#      identity を GitHub infra に依存させる = supply chain attack surface)。 aegis-core
#      release.yml (runs-on: [self-hosted, macOS, ARM64, aegis-mac]) と同 mandate。
#      ci.yml の Block A (read-only) のみ ubuntu-latest 例外。
#      F-060 record: 過去 T-009-1 で本 mandate 違反、 sprint_009 iter 1e で literal 修正。
#
# === OUTPUT (sprint_009 closure 要件) ===
#
#   - node SBOM (CycloneDX JSON) attached to release
#   - python SBOM (CycloneDX JSON) attached to release
#   - GitHub native build provenance attestation (SLSA Level 3 equivalent) for both
#   - Source-snapshot SHA recorded in attestation predicate
#
# === Block status ===
#
#   - Block A (SBOM + cosign sign-blob keyless + Release attach): ✅ wired (sprint_009)
#   - Block B Phase 2 (SDK 本体 artifact pack + cosign sign + Release attach): ✅ wired (sprint_010)
#   - Block C (npm Trusted Publisher OIDC publish + provenance + dist-tag): ✅ wired
#     (T-011-11, line 363+, `if: tag push only` gated, requires npm ≥11.5.1)
#   - PyPI Trusted Publisher attestation: pending (follow-up, line 245 stub)
#   - Reproducible build verification: deferred (audit/integrity 系)
#
# References:
#   - https://github.com/CycloneDX/cdxgen
#   - https://github.com/actions/attest-build-provenance
#   - https://slsa.dev/spec/v1.0/levels#build-l3
#   - operational-trust-review: family_5_ops_ci_release / supply_chain_attestation

name: release-attestation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attest (omit to attest current commit as preview)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # release artifact upload
  id-token: write       # OIDC token for Sigstore + GitHub native attestation
  attestations: write   # GitHub native attestation API

concurrency:
  group: release-attestation-${{ github.ref }}
  cancel-in-progress: false   # release は途中中断 NG

jobs:
  sbom-node:
    name: SBOM (Node — CycloneDX)
    runs-on: [self-hosted, macOS, ARM64, aegis-mac]
    outputs:
      sbom-path: ${{ steps.gen.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Install Node deps (production only)
        working-directory: node
        run: npm ci --omit=dev

      - name: Generate CycloneDX SBOM (Node)
        id: gen
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cdxgen via npx (no global install)、 CycloneDX v1.5 JSON format
          npx -y @cyclonedx/cdxgen@10 \
            --type js \
            --output sbom/aegis-trust-node.cdx.json \
            --spec-version 1.5 \
            node/
          echo "sbom-path=sbom/aegis-trust-node.cdx.json" >> "$GITHUB_OUTPUT"
          echo "[sbom-node] generated $(wc -l < sbom/aegis-trust-node.cdx.json) lines"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-node
          path: sbom/aegis-trust-node.cdx.json
          retention-days: 90

  sbom-python:
    name: SBOM (Python — CycloneDX)
    runs-on: [self-hosted, macOS, ARM64, aegis-mac]
    outputs:
      sbom-path: ${{ steps.gen.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node (for cdxgen)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Verify system Python (self-hosted aegis-mac runner)
        # actions/setup-python hardcodes /Users/runner/hostedtoolcache as the
        # macOS install target (install-python.sh "Creating Python hostedtoolcache
        # folder..." → `mkdir /Users/runner` → Permission denied on self-hosted
        # runner whose home is /Users/incierge). Setting AGENT_TOOLSDIRECTORY /
        # RUNNER_TOOL_CACHE in the runner launchd plist did not override the
        # hardcoded path (verified 2026-05-24 on mac-m5-aegis-trust runner).
        # SBOM generation only needs python3 in PATH for cdxgen subprocess
        # invocation (Python is not the executor — cdxgen is node-launched);
        # system Python from /opt/homebrew/bin is sufficient and avoids the
        # setup-python hostedtoolcache trap entirely.
        run: |
          set -euo pipefail
          which python3
          python3 --version

      - name: Generate CycloneDX SBOM (Python via cdxgen)
        id: gen
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cdxgen は --type python で pyproject.toml + lock 系 auto-detect
          # cyclonedx-bom CLI は v7 で flag 仕様変更 (--schema-version 不認識) のため
          # 既に sbom-node で実績ある cdxgen に統一 (single tool variance 0)
          npx -y @cyclonedx/cdxgen@10 \
            --type python \
            --output sbom/aegis-trust-python.cdx.json \
            --spec-version 1.5 \
            python/
          echo "sbom-path=sbom/aegis-trust-python.cdx.json" >> "$GITHUB_OUTPUT"
          echo "[sbom-python] generated $(wc -l < sbom/aegis-trust-python.cdx.json) lines"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-python
          path: sbom/aegis-trust-python.cdx.json
          retention-days: 90

  collect-and-sign:
    name: Cosign sign SBOMs + Release attach
    needs: [sbom-node, sbom-python]
    runs-on: [self-hosted, macOS, ARM64, aegis-mac]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download SBOMs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: sbom-input

      - name: Collect SBOMs into single dir
        run: |
          set -euo pipefail
          mkdir -p sbom
          find sbom-input -name '*.cdx.json' -exec cp {} sbom/ \;
          ls -la sbom/

      # Sigstore cosign keyless signing — private repo でも動作 (OIDC + Rekor 公開 log)。
      # GitHub native attest-build-provenance は user-owned private repo 非対応のため
      # cosign 経由で SLSA-equivalent signing 実現。 keyless = no key 管理 overhead。
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62  # v3.10.0 (real SHA verified via gh api)
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign sign SBOMs (keyless, Sigstore Rekor)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for sbom in sbom/*.cdx.json; do
            echo "[cosign] signing $sbom (keyless)"
            cosign sign-blob --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "$sbom"
            echo "[cosign] verifying $sbom"
            cosign verify-blob \
              --certificate "${sbom}.pem" \
              --signature "${sbom}.sig" \
              --certificate-identity-regexp 'https://github\.com/.+/.github/workflows/release-attestation\.yml@.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$sbom"
          done
          ls -la sbom/

      - name: Upload signed SBOM bundle as artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-signed
          path: sbom/*
          retention-days: 90

      - name: Upload SBOMs + signatures to Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          files: |
            sbom/*.cdx.json
            sbom/*.sig
            sbom/*.pem
          fail_on_unmatched_files: true

  # === Block B Phase 2 (sprint_010 T-010-5) =========================================
  # SDK 本体 artifact (npm tarball + PyPI wheel) を cosign keyless で署名。
  # SBOM 署名 (上の collect-and-sign job) だけでは顧客が `npm install aegis-trust` /
  # `pip install aegis-trust` した時に検証できるのは「dependency 一覧」 のみで、
  # SDK 本体の正当性 (= 顧客が真に検証したい trust signal) は未 cover。 本 job が
  # SDK artifact 自体を sign することで「artifact = signed-by-aegis-org の同一性」
  # を Sigstore Rekor public log に literal 記録 → enterprise procurement (CSO /
  # supply-chain auditor) が `cosign verify-blob` で literal 検証可能に。
  #
  # Phase 2 scope:
  #   - npm pack で aegis-trust-<version>.tgz を build
  #   - python -m build で aegis_trust-<version>-py3-none-any.whl + .tar.gz を build
  #   - cosign sign-blob keyless で 3 artifact (tgz + whl + sdist) を署名
  #   - upload signed bundle + release attach (tag push 時)
  #
  # Not yet (sprint_011+):
  #   - npm publish --provenance flag (publish workflow 統合、 Stage A 再開後)
  #   - PyPI trusted publisher attestation (PyPI 側設定 + workflow 拡張)
  #   - Reproducible build verification
  #
  pack-and-sign-sdk:
    name: Pack + Cosign sign SDK artifacts (npm tarball + PyPI wheel/sdist)
    needs: [sbom-node, sbom-python]
    runs-on: [self-hosted, macOS, ARM64, aegis-mac]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Verify system Python (self-hosted aegis-mac runner)
        # actions/setup-python hardcodes /Users/runner/hostedtoolcache as the
        # macOS install target (install-python.sh "Creating Python hostedtoolcache
        # folder..." → `mkdir /Users/runner` → Permission denied on self-hosted
        # runner whose home is /Users/incierge). Setting AGENT_TOOLSDIRECTORY /
        # RUNNER_TOOL_CACHE in the runner launchd plist did not override the
        # hardcoded path (verified 2026-05-24 on mac-m5-aegis-trust runner).
        # SBOM generation only needs python3 in PATH for cdxgen subprocess
        # invocation (Python is not the executor — cdxgen is node-launched);
        # system Python from /opt/homebrew/bin is sufficient and avoids the
        # setup-python hostedtoolcache trap entirely.
        run: |
          set -euo pipefail
          which python3
          python3 --version

      - name: Install Python build tools (PEP 668 break-system-packages for Homebrew Python)
        # macOS Homebrew Python 3.11+ enforces PEP 668 (externally-managed-environment):
        # `pip install ...` directly into system site-packages → crash with
        # `error: externally-managed-environment`. The release-only context
        # (ephemeral runner job, no long-lived environment to protect) allows
        # `--break-system-packages` safely. Alternative would be a venv per job;
        # break-system-packages is simpler and well-scoped here.
        # Use `python3 -m pip` to bind to the python3 we just verified, not a
        # potentially-missing unversioned `pip` (Homebrew installs only `pip3`).
        run: python3 -m pip install --no-cache-dir --break-system-packages build hatchling

      - name: Build npm tarball
        working-directory: node
        run: |
          set -euo pipefail
          # devDeps (typescript / tsc) required for `npm run build`; --omit=dev
          # would skip them and produce `sh: tsc: command not found` (verified
          # on dry-run #26349851993, 2026-05-24). Use the full install for the
          # build step; the published tarball only contains the compiled dist/
          # so the runtime install set is unaffected.
          npm ci
          npm run build
          rm -f aegis-trust-*.tgz
          npm pack
          ls -la aegis-trust-*.tgz

      - name: Build PyPI wheel + sdist
        working-directory: python
        run: |
          set -euo pipefail
          # python3 (versioned) to match the rest of the job — Homebrew Python
          # installs `python3` only, no unversioned `python` symlink.
          python3 -m build
          ls -la dist/

      - name: Collect SDK artifacts into single dir
        run: |
          set -euo pipefail
          mkdir -p sdk-artifacts
          cp node/aegis-trust-*.tgz sdk-artifacts/
          cp python/dist/aegis_trust-*.whl sdk-artifacts/
          cp python/dist/aegis_trust-*.tar.gz sdk-artifacts/
          ls -la sdk-artifacts/

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62  # v3.10.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign sign SDK artifacts (keyless, Sigstore Rekor)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for artifact in sdk-artifacts/*; do
            case "$artifact" in
              *.sig|*.pem) continue ;;
            esac
            echo "[cosign] signing $artifact (keyless)"
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
            echo "[cosign] verifying $artifact"
            cosign verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity-regexp 'https://github\.com/.+/.github/workflows/release-attestation\.yml@.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$artifact"
          done
          ls -la sdk-artifacts/

      - name: Upload signed SDK artifact bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sdk-artifacts-signed
          path: sdk-artifacts/*
          retention-days: 90

      - name: Upload SDK artifacts + signatures to Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          files: |
            sdk-artifacts/*.tgz
            sdk-artifacts/*.whl
            sdk-artifacts/*.tar.gz
            sdk-artifacts/*.sig
            sdk-artifacts/*.pem
          fail_on_unmatched_files: true

      # === Block C (productization-ops/sprint_011 T-011-11): npm Trusted Publisher OIDC publish ==
      # 1-event setup → 0-event automation。 token/OTP/recovery code 永続不要。
      #
      # Prerequisites (one-time, operator-side):
      #   1. https://www.npmjs.com/package/aegis-trust/access → Trusted Publishers tab
      #   2. Add publisher: GitHub Actions
      #   3. Repository: Incierge3789/aegis-trust
      #   4. Workflow filename: release-attestation.yml
      #   5. (Optional) Environment: leave blank (no environment gate)
      #   6. Save
      # After this one-time UI setup, every tag push (v*) auto-publishes to npm
      # with provenance attestation, with NO token / NO OTP / NO recovery code.
      #
      # Why id-token: write here is sufficient:
      #   The job already declares id-token: write at the workflow permissions
      #   block (line 60) for Sigstore. npm trusted publisher uses the same
      #   OIDC issuer (token.actions.githubusercontent.com). No additional
      #   permission required.
      #
      # provenance flag:
      #   --provenance attaches an SLSA Level 3 build provenance statement
      #   that customers can verify with `npm audit signatures`. Requires
      #   trusted publisher (cannot coexist with --auth-type=legacy token).
      - name: Setup Node for npm publish (Node 24 = npm ≥11.5.1 for Trusted Publisher OIDC)
        # npm Trusted Publisher OIDC requires npm >= 11.5.1 (`--otp` replaced by
        # OIDC token exchange). Node 20 ships npm 10.x → publish fails with auth
        # error despite `id-token: write`. Node 24 ships npm ≥11.5.1.
        #
        # registry-url is deliberately NOT set: setting it auto-generates
        # `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}`, but Trusted Publisher
        # OIDC does NOT set NODE_AUTH_TOKEN → npm CLI crashes with
        # `Failed to replace env in config: ${NODE_AUTH_TOKEN}` before the
        # OIDC exchange even starts. Default registry is npmjs.org anyway.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '24'

      - name: npm publish via Trusted Publisher OIDC (tag push only, no token)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        working-directory: sdk-artifacts
        run: |
          set -euo pipefail
          # tag name like v0.9.0-rc6 → npm dist-tag = "rc" for pre-release,
          # "latest" for final release. Pre-release detection: presence of "-"
          # in the version part (rc, beta, alpha, etc.).
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="rc"
            echo "[npm] pre-release version $VERSION → publishing with --tag rc"
          else
            DIST_TAG="latest"
            echo "[npm] stable version $VERSION → publishing with --tag latest"
          fi
          # Find the tarball built by the Pack step earlier in this job.
          # File layout: sdk-artifacts/aegis-trust-<version>.tgz
          TGZ="aegis-trust-${VERSION}.tgz"
          if [ ! -f "$TGZ" ]; then
            echo "ERROR: expected tarball $TGZ not found in sdk-artifacts/" >&2
            ls -la
            exit 1
          fi
          echo "[npm] publishing $TGZ with --provenance --tag $DIST_TAG --access public"
          npm publish "$TGZ" --provenance --tag "$DIST_TAG" --access public

      - name: npm dist-tag promote to latest (final release only, tag push)
        # Promote `latest` only when the published version is a final release
        # (no pre-release suffix). For rc / beta / alpha, leave `latest` alone
        # so a bare `npm install aegis-trust` does not regress to a preview.
        # Operators can manually `npm dist-tag add aegis-trust@<rc> latest` if
        # they intentionally want rc as the default.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "[npm] pre-release $VERSION — skipping latest promotion (already published with --tag rc)"
          else
            echo "[npm] stable $VERSION — confirming latest tag (npm publish with --tag latest already set it)"
            npm dist-tag ls aegis-trust
          fi
