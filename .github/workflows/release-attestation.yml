# aegis-trust release-attestation workflow (Block B)
#
# Purpose: supply-chain attestation for releases — CycloneDX SBOMs, Sigstore
# cosign keyless signatures, and SDK-artifact signing attached to the GitHub
# Release, plus npm Trusted Publisher OIDC publish on tag push.
#
# === SAFETY INVARIANTS (must hold) ===
#
#   1. Trigger は workflow_dispatch (manual) または tag push (`v*`) のみ。
#      pull_request_target を **使わない** (token theft 攻撃面)。
#   2. permissions に `id-token: write` を持つ — Sigstore keyless signing (cosign)
#      と GitHub native build provenance (actions/attest-build-provenance) のため。
#      Block A の ci.yml と完全分離 (ci.yml は read-only contract)。
#   3. Secrets (NPM_TOKEN / PYPI_TOKEN) は本 workflow は **使わない**。 npm publish は
#      **Block C で npm Trusted Publisher OIDC** 経由 (token なし、 id-token: write OIDC、
#      npm ≥11.5.1 で literal supported)。 PyPI publish は **将来 Trusted Publisher**
#      経由 (本 file line 245 follow-up)、 現状 PyPI 側は manual twine + ~/.pypirc 経由
#      (本 workflow は触らない)。 outputs = SBOM + attestation + release artifact attach
#      + npm tag-push-only publish (Block C)。
#   4. 全 third-party action は 40-char commit SHA pin。 tag pin 禁止 (mutation attack)。
#   5. Runner = a designated self-hosted release runner (mandatory; Block B =
#      release-class, supply-chain trust core). ubuntu-latest = GitHub-hosted is
#      disallowed for release jobs (it ties the cosign keyless OIDC identity to
#      GitHub infra = a supply-chain attack surface). The runner labels are
#      supplied via the `RELEASE_RUNNER_LABELS` repository variable so the
#      concrete runner identity is not committed to source. Only ci.yml Block A
#      (read-only) is exempt and may use ubuntu-latest.
#
# === OUTPUT (sprint_009 closure 要件) ===
#
#   - node SBOM (CycloneDX JSON) attached to release
#   - python SBOM (CycloneDX JSON) attached to release
#   - GitHub native build provenance attestation (SLSA Level 3 equivalent) for both
#   - Source-snapshot SHA recorded in attestation predicate
#
# === Block status ===
#
#   - Block A (SBOM + cosign sign-blob keyless + Release attach): ✅ wired (sprint_009)
#   - Block B Phase 2 (SDK 本体 artifact pack + cosign sign + Release attach): ✅ wired (sprint_010)
#   - Block C (npm Trusted Publisher OIDC publish + provenance + dist-tag): ✅ wired
#     (T-011-11, line 363+, `if: tag push only` gated, requires npm ≥11.5.1)
#   - PyPI Trusted Publisher attestation: pending (follow-up, line 245 stub)
#   - Reproducible build verification: deferred (audit/integrity 系)
#
# References:
#   - https://github.com/CycloneDX/cdxgen
#   - https://github.com/actions/attest-build-provenance
#   - https://slsa.dev/spec/v1.0/levels#build-l3
#   - https://docs.sigstore.dev/cosign/overview/
#
# === Required repository configuration (maintainer, one-time) ===
#
#   To keep the release infrastructure out of public source, this workflow reads
#   it from repository-level Actions variables instead of hardcoding it:
#     - vars.RELEASE_RUNNER_LABELS   — JSON array of the self-hosted release
#         runner labels, e.g. ["self-hosted","macOS","ARM64","<runner-label>"].
#         Consumed by `runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}`.
#     - vars.AEGIS_QUALITY_GATE_PATH — absolute path to the executable
#         quality-gate script provisioned on the release runner.
#   Set both under Settings → Secrets and variables → Actions → Variables.
#   If a variable is unset, the release jobs fail closed (nothing is published)
#   rather than leaking an internal path or runner identity.

name: release-attestation

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attest (omit to attest current commit as preview)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # release artifact upload
  id-token: write       # OIDC token for Sigstore + GitHub native attestation
  attestations: write   # GitHub native attestation API

concurrency:
  group: release-attestation-${{ github.ref }}
  cancel-in-progress: false   # release は途中中断 NG

jobs:
  productization-gate:
    name: Productization Gate (9-verifier dogfood, fail-closed)
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify quality gate present on the release runner
        env:
          AEGIS_QUALITY_GATE_PATH: ${{ vars.AEGIS_QUALITY_GATE_PATH }}
        run: |
          set -euo pipefail
          GATE="${AEGIS_QUALITY_GATE_PATH:?repository variable AEGIS_QUALITY_GATE_PATH is not set}"
          if [ ! -x "$GATE" ]; then
            echo "quality gate runner not found at $GATE" >&2
            echo "expected: AEGIS_QUALITY_GATE_PATH must point to an executable quality-gate script provisioned on the release runner" >&2
            exit 2
          fi
          echo "[productization-gate] runner OK: $GATE"

      - name: Build node SDK (dist/) for gate verifiers that scan compiled output
        # idempotency_guarantee invocation_runner.mjs imports from node/dist/index.js;
        # agent_callable_surface scans dist/*.d.ts. Both need a built artifact.
        # tsc must run before the verifier dogfood so a fresh-checkout runner has dist/.
        working-directory: node
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm run build
          [ -f dist/index.js ] || { echo "node dist/index.js missing after build" >&2; exit 2; }
          [ -f dist/index.d.ts ] || { echo "node dist/index.d.ts missing after build" >&2; exit 2; }
          echo "[productization-gate] node dist/ built ($(ls dist | wc -l | tr -d ' ') files)"

      - name: Run 9-verifier dogfood (P0 fail-closed; pending P1 accepted)
        env:
          AEGIS_QUALITY_GATE_PATH: ${{ vars.AEGIS_QUALITY_GATE_PATH }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          [ -n "$TAG" ] || TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="manual-dispatch"
          bash "${AEGIS_QUALITY_GATE_PATH:?repository variable AEGIS_QUALITY_GATE_PATH is not set}" "$TAG" "$GITHUB_WORKSPACE"

  sbom-node:
    name: SBOM (Node — CycloneDX)
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    needs: [productization-gate]
    outputs:
      sbom-path: ${{ steps.gen.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Install Node deps (production only)
        working-directory: node
        run: npm ci --omit=dev

      - name: Generate CycloneDX SBOM (Node)
        id: gen
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cdxgen via npx (no global install)、 CycloneDX v1.5 JSON format
          npx -y @cyclonedx/cdxgen@10 \
            --type js \
            --output sbom/aegis-trust-node.cdx.json \
            --spec-version 1.5 \
            node/
          echo "sbom-path=sbom/aegis-trust-node.cdx.json" >> "$GITHUB_OUTPUT"
          echo "[sbom-node] generated $(wc -l < sbom/aegis-trust-node.cdx.json) lines"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-node
          path: sbom/aegis-trust-node.cdx.json
          retention-days: 90

  sbom-python:
    name: SBOM (Python — CycloneDX)
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    needs: [productization-gate]
    outputs:
      sbom-path: ${{ steps.gen.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node (for cdxgen)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Verify system Python (self-hosted runner)
        # actions/setup-python hardcodes /Users/runner/hostedtoolcache as the
        # macOS install target (install-python.sh "Creating Python hostedtoolcache
        # folder..." → `mkdir /Users/runner` → Permission denied on self-hosted
        # runner whose home is not /Users/runner). Setting AGENT_TOOLSDIRECTORY /
        # RUNNER_TOOL_CACHE in the runner launchd plist did not override the
        # hardcoded path (verified on the self-hosted runner).
        # SBOM generation only needs python3 in PATH for cdxgen subprocess
        # invocation (Python is not the executor — cdxgen is node-launched);
        # system Python from /opt/homebrew/bin is sufficient and avoids the
        # setup-python hostedtoolcache trap entirely.
        run: |
          set -euo pipefail
          which python3
          python3 --version

      - name: Generate CycloneDX SBOM (Python via cdxgen)
        id: gen
        run: |
          set -euo pipefail
          mkdir -p sbom
          # cdxgen は --type python で pyproject.toml + lock 系 auto-detect
          # cyclonedx-bom CLI は v7 で flag 仕様変更 (--schema-version 不認識) のため
          # 既に sbom-node で実績ある cdxgen に統一 (single tool variance 0)
          npx -y @cyclonedx/cdxgen@10 \
            --type python \
            --output sbom/aegis-trust-python.cdx.json \
            --spec-version 1.5 \
            python/
          echo "sbom-path=sbom/aegis-trust-python.cdx.json" >> "$GITHUB_OUTPUT"
          echo "[sbom-python] generated $(wc -l < sbom/aegis-trust-python.cdx.json) lines"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-python
          path: sbom/aegis-trust-python.cdx.json
          retention-days: 90

  collect-and-sign:
    name: Cosign sign SBOMs + Release attach
    needs: [sbom-node, sbom-python]
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download SBOMs
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: sbom-input

      - name: Collect SBOMs into single dir
        run: |
          set -euo pipefail
          mkdir -p sbom
          find sbom-input -name '*.cdx.json' -exec cp {} sbom/ \;
          ls -la sbom/

      # Sigstore cosign keyless signing — private repo でも動作 (OIDC + Rekor 公開 log)。
      # GitHub native attest-build-provenance は user-owned private repo 非対応のため
      # cosign 経由で SLSA-equivalent signing 実現。 keyless = no key 管理 overhead。
      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62  # v3.10.0 (real SHA verified via gh api)
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign sign SBOMs (keyless, Sigstore Rekor)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for sbom in sbom/*.cdx.json; do
            echo "[cosign] signing $sbom (keyless)"
            cosign sign-blob --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "$sbom"
            echo "[cosign] verifying $sbom"
            cosign verify-blob \
              --certificate "${sbom}.pem" \
              --signature "${sbom}.sig" \
              --certificate-identity-regexp 'https://github\.com/.+/.github/workflows/release-attestation\.yml@.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$sbom"
          done
          ls -la sbom/

      - name: Upload signed SBOM bundle as artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-signed
          path: sbom/*
          retention-days: 90

      - name: Upload SBOMs + signatures to Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          files: |
            sbom/*.cdx.json
            sbom/*.sig
            sbom/*.pem
          fail_on_unmatched_files: true

  # === Block B Phase 2 (sprint_010 T-010-5) =========================================
  # SDK 本体 artifact (npm tarball + PyPI wheel) を cosign keyless で署名。
  # SBOM 署名 (上の collect-and-sign job) だけでは顧客が `npm install aegis-trust` /
  # `pip install aegis-trust` した時に検証できるのは「dependency 一覧」 のみで、
  # SDK 本体の正当性 (= 顧客が真に検証したい trust signal) は未 cover。 本 job が
  # SDK artifact 自体を sign することで「artifact = signed-by-aegis-org の同一性」
  # を Sigstore Rekor public log に literal 記録 → enterprise procurement (CSO /
  # supply-chain auditor) が `cosign verify-blob` で literal 検証可能に。
  #
  # Phase 2 scope:
  #   - npm pack で aegis-trust-<version>.tgz を build
  #   - python -m build で aegis_trust-<version>-py3-none-any.whl + .tar.gz を build
  #   - cosign sign-blob keyless で 3 artifact (tgz + whl + sdist) を署名
  #   - upload signed bundle + release attach (tag push 時)
  #
  # Not yet (sprint_011+):
  #   - npm publish --provenance flag (publish workflow 統合、 Stage A 再開後)
  #   - PyPI trusted publisher attestation (PyPI 側設定 + workflow 拡張)
  #   - Reproducible build verification
  #
  pack-and-sign-sdk:
    name: Pack + Cosign sign SDK artifacts (npm tarball + PyPI wheel/sdist)
    needs: [sbom-node, sbom-python]
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_LABELS) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Verify system Python (self-hosted runner)
        # actions/setup-python hardcodes /Users/runner/hostedtoolcache as the
        # macOS install target (install-python.sh "Creating Python hostedtoolcache
        # folder..." → `mkdir /Users/runner` → Permission denied on self-hosted
        # runner whose home is not /Users/runner). Setting AGENT_TOOLSDIRECTORY /
        # RUNNER_TOOL_CACHE in the runner launchd plist did not override the
        # hardcoded path (verified on the self-hosted runner).
        # SBOM generation only needs python3 in PATH for cdxgen subprocess
        # invocation (Python is not the executor — cdxgen is node-launched);
        # system Python from /opt/homebrew/bin is sufficient and avoids the
        # setup-python hostedtoolcache trap entirely.
        run: |
          set -euo pipefail
          which python3
          python3 --version

      - name: Install Python build tools (PEP 668 break-system-packages for Homebrew Python)
        # macOS Homebrew Python 3.11+ enforces PEP 668 (externally-managed-environment):
        # `pip install ...` directly into system site-packages → crash with
        # `error: externally-managed-environment`. The release-only context
        # (ephemeral runner job, no long-lived environment to protect) allows
        # `--break-system-packages` safely. Alternative would be a venv per job;
        # break-system-packages is simpler and well-scoped here.
        # Use `python3 -m pip` to bind to the python3 we just verified, not a
        # potentially-missing unversioned `pip` (Homebrew installs only `pip3`).
        run: python3 -m pip install --no-cache-dir --break-system-packages build hatchling

      - name: Build npm tarball
        working-directory: node
        run: |
          set -euo pipefail
          # devDeps (typescript / tsc) required for `npm run build`; --omit=dev
          # would skip them and produce `sh: tsc: command not found` (verified
          # on dry-run #26349851993, 2026-05-24). Use the full install for the
          # build step; the published tarball only contains the compiled dist/
          # so the runtime install set is unaffected.
          npm ci
          npm run build
          rm -f aegis-trust-*.tgz
          npm pack
          ls -la aegis-trust-*.tgz

      - name: Build PyPI wheel + sdist
        working-directory: python
        run: |
          set -euo pipefail
          # python3 (versioned) to match the rest of the job — Homebrew Python
          # installs `python3` only, no unversioned `python` symlink.
          python3 -m build
          ls -la dist/

      - name: Collect SDK artifacts into single dir
        run: |
          set -euo pipefail
          mkdir -p sdk-artifacts
          cp node/aegis-trust-*.tgz sdk-artifacts/
          cp python/dist/aegis_trust-*.whl sdk-artifacts/
          cp python/dist/aegis_trust-*.tar.gz sdk-artifacts/
          ls -la sdk-artifacts/

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62  # v3.10.0
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign sign SDK artifacts (keyless, Sigstore Rekor)
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for artifact in sdk-artifacts/*; do
            case "$artifact" in
              *.sig|*.pem) continue ;;
            esac
            echo "[cosign] signing $artifact (keyless)"
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "$artifact"
            echo "[cosign] verifying $artifact"
            cosign verify-blob \
              --certificate "${artifact}.pem" \
              --signature "${artifact}.sig" \
              --certificate-identity-regexp 'https://github\.com/.+/.github/workflows/release-attestation\.yml@.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$artifact"
          done
          ls -la sdk-artifacts/

      - name: Upload signed SDK artifact bundle
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sdk-artifacts-signed
          path: sdk-artifacts/*
          retention-days: 90

      - name: Upload SDK artifacts + signatures to Release (tag push only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8  # v2.0.9
        with:
          files: |
            sdk-artifacts/*.tgz
            sdk-artifacts/*.whl
            sdk-artifacts/*.tar.gz
            sdk-artifacts/*.sig
            sdk-artifacts/*.pem
          fail_on_unmatched_files: true

      # === Block C build artifact handoff for github-hosted publish ==
      # npm Trusted Publisher provenance (--provenance flag + OIDC) is rejected
      # by the registry when run from a self-hosted runner: literal error from
      # npm 11.x registry side is `422 Unprocessable Entity - Error verifying
      # sigstore provenance bundle: Unsupported GitHub Actions runner
      # environment: "self-hosted". Only "github-hosted" runners are supported
      # when publishing with provenance.` (literal observed on run 26353133043
      # against the self-hosted runner).
      #
      # Block C is therefore split across two jobs:
      #   - pack-and-sign-sdk (this self-hosted job): build + cosign keyless
      #     sign-blob + GitHub Release attach. Stays on the self-hosted runner
      #     so cosign keyless OIDC identity does NOT depend on GitHub-hosted
      #     infra (SAFETY INVARIANT #5 preserved).
      #   - publish-npm-trusted-publisher (github-hosted ubuntu-latest job
      #     below): npm publish --provenance via Trusted Publisher OIDC.
      #     Receives the already-cosign-signed .tgz via upload-artifact /
      #     download-artifact handoff so the artifact ingested by the
      #     publish step is byte-identical to the one cosign signed on
      #     self-hosted.
      - name: Upload .tgz for github-hosted publish job (Block C handoff)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: npm-tarball-for-publish
          path: sdk-artifacts/aegis-trust-*.tgz
          retention-days: 1
          if-no-files-found: error

  # === Block C publish job (github-hosted) ============================================
  # Runs ONLY on tag push. Receives the cosign-signed .tgz from pack-and-sign-sdk
  # via download-artifact, then publishes to npm with Trusted Publisher OIDC +
  # --provenance. github-hosted runner is mandatory here because npm registry
  # 422-rejects --provenance from self-hosted runners (see comment in
  # pack-and-sign-sdk above).
  #
  # SAFETY INVARIANT #5 boundary: cosign keyless OIDC identity stays on
  # self-hosted (signing path). npm registry OIDC happens on github-hosted
  # (token exchange, distinct identity, audited via npm Trusted Publisher
  # cert-identity regexp tied to this exact workflow file). No cosign on
  # github-hosted, no signing keys on github-hosted.
  publish-npm-trusted-publisher:
    name: npm publish (Trusted Publisher OIDC, github-hosted, --provenance)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [pack-and-sign-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for npm Trusted Publisher (token exchange only)
    steps:
      - name: Download cosign-signed .tgz from build job
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: npm-tarball-for-publish
          path: tarball

      - name: Setup Node 24 (npm ≥11.5.1 required for Trusted Publisher OIDC)
        # Node 20 ships npm 10.x; OIDC token exchange requires npm >= 11.5.1.
        # registry-url is deliberately omitted: setting it auto-generates
        # .npmrc with _authToken=${NODE_AUTH_TOKEN}, but Trusted Publisher
        # OIDC does not set NODE_AUTH_TOKEN -> npm CLI crashes before the
        # OIDC exchange even starts.
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '24'

      - name: npm publish via Trusted Publisher OIDC (no --provenance, private-repo constraint)
        # --provenance is intentionally OMITTED here. npm registry rejects
        # provenance from private GitHub repositories:
        #   literal 422 on run 26353466944 2026-05-24:
        #     "Unsupported GitHub Actions source repository visibility:
        #      'private'. Only public source repositories are supported
        #      when publishing with provenance."
        # aegis-trust is PRIVATE per F-050 mandate (repo public flip
        # requires explicit Giri authorization, blocked until
        # productization quality evidence is in).
        # Trusted Publisher OIDC token-free publish still works WITHOUT
        # provenance (no token / no OTP / no recovery code consumed).
        # Customer-side provenance verification is available via
        # `cosign verify-blob` against the GitHub Release attached .tgz
        # (Block B Phase 2 above). Only the npm-side `npm audit
        # signatures` feed is missing until the repo flips to public.
        # Re-enable: add `--provenance` back to the npm publish command
        # the same day the repo goes public.
        working-directory: tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="rc"
            echo "[npm] pre-release version $VERSION → publishing with --tag rc"
          else
            DIST_TAG="latest"
            echo "[npm] stable version $VERSION → publishing with --tag latest"
          fi
          TGZ="aegis-trust-${VERSION}.tgz"
          if [ ! -f "$TGZ" ]; then
            echo "ERROR: expected tarball $TGZ not found in tarball/" >&2
            ls -la
            exit 1
          fi
          echo "[npm] publishing $TGZ with --tag $DIST_TAG --access public (OIDC, no --provenance, private repo)"
          npm publish "$TGZ" --tag "$DIST_TAG" --access public

      - name: npm dist-tag verify (pre-release leaves latest alone)
        # Pre-release versions (-rc, -beta, -alpha) intentionally do NOT
        # promote latest, so a bare `npm install aegis-trust` does not
        # regress to a preview. The bare-install -> rc redirect waits for
        # the v1.0 GA cut (mirrors the PyPI semver semantics in README
        # alpha-limitation 6).
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "[npm] post-publish dist-tag state:"
          npm dist-tag ls aegis-trust
          if [[ "$VERSION" == *-* ]]; then
            echo "[npm] pre-release $VERSION → latest tag intentionally not promoted"
          else
            echo "[npm] stable $VERSION → latest tag set by npm publish above"
          fi
