# release-on-main — setup-once release automation (2026-09-05).
#
# Why: a release used to need a human to push a v* tag from a laptop. The
# publish jobs of release-attestation.yml only run on a tag PUSH event, their
# hand-off artifacts live one day, and the operator gate on the workstation
# refuses a session's own approval — so every release cost the operator two
# shell commands and, when a tagged commit carried a metadata defect, two more.
#
# Now: the release decision is the merge of a version-bump pull request. On
# every push to main this workflow reads the version pins; ONLY if the pin
# changed in the pushed range (before → HEAD) and `v<version>` does not exist
# yet, it creates the tag at the merged commit and CALLS
# release-attestation.yml with that tag (workflow_call), so gate → SBOM → sign
# → pack → npm/PyPI Trusted Publisher upload run in this same run. The
# version pin must have CHANGED in the pushed range (a bump merge); a merge
# that leaves the pin untouched never releases, even if the tag is missing. A tag
# created with GITHUB_TOKEN deliberately does not trigger the tag-push path
# (GitHub never cascades GITHUB_TOKEN events), so there is exactly one release
# run per version. A push whose version tag already exists is a no-op.
#
# Fail-closed: node and python pins must agree; an existing tag is never moved;
# an unreadable previous pin (first push, force push) never releases; nothing
# here uses a personal token or a registry secret (Trusted Publisher OIDC is
# inherited from release-attestation.yml).
#
# Recovery: if the called release fails AFTER the tag was created, re-run the
# failed jobs of that run (hand-off artifacts live one day) — or delete the tag
# and merge a new bump. This workflow will not re-release an existing tag.
name: release-on-main

on:
  push:
    branches:
      - main

permissions:
  contents: write     # create the version tag

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  tag-if-bumped:
    name: Create the version tag when a version bump landed on main
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Read the version pins and create the tag if it does not exist
        id: tag
        run: |
          set -euo pipefail
          NODE_V="$(node -p "require('./node/package.json').version")"
          PY_V="$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          FILE_V="$(tr -d '[:space:]' < node/VERSION)"
          if [ "$NODE_V" != "$PY_V" ] || [ "$NODE_V" != "$FILE_V" ]; then
            echo "version pins disagree (package.json=$NODE_V pyproject=$PY_V node/VERSION=$FILE_V) — not releasing" >&2
            exit 2
          fi
          TAG="v$NODE_V"
          # The tag is derived from the version pin, never from an input; still,
          # pin the shape so a malformed pin can never reach git or the gate.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "version pin '$NODE_V' is not a release version — not releasing" >&2
            exit 2
          fi
          # Release only when THIS push changed the version pin (a version-bump
          # merge). A docs merge after someone deleted a tag must not re-release,
          # and the first push after enabling this workflow must not either.
          BEFORE="${{ github.event.before }}"
          PREV_V=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            PREV_V="$(git show "$BEFORE:node/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)"
          fi
          if [ "$PREV_V" = "$NODE_V" ]; then
            echo "[release-on-main] version pin unchanged ($NODE_V) by this push — nothing to release"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PREV_V" ]; then
            echo "[release-on-main] cannot read the previous version pin (before=$BEFORE) — not releasing on an unknown delta"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "[release-on-main] $TAG already exists — nothing to release for $GITHUB_SHA"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[release-on-main] version bump $PREV_V → $NODE_V merged; releasing $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release $TAG (version bump merged to main: $GITHUB_SHA)" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "[release-on-main] created $TAG at $GITHUB_SHA"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Build, sign, attach and upload the tagged release
    needs: tag-if-bumped
    if: needs.tag-if-bumped.outputs.release_tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-attestation.yml
    with:
      release_tag: ${{ needs.tag-if-bumped.outputs.release_tag }}
    secrets: inherit
