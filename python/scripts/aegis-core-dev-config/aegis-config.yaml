# Aegis Gateway Configuration
# Generated by: aegis-gateway init
# Documentation: docs/customer/reference/configuration.md

version: "1"

paths:
  capsule_root: "/opt/aegis/capsules"
  audit_path: "/opt/aegis/audit/audit.jsonl"
  workspace_root: "/opt/aegis/workspace"
  socket_path: "/opt/aegis/run/aegis-gateway.sock"

server:
  rest_port: 8443
  tls_enabled: true
  tls_required: true
  tls_cert: "/opt/aegis/certs/server.crt"
  tls_key: "/opt/aegis/certs/server.key"
  mtls_required: false
  ip_allowlist:
    - "127.0.0.1/32"

auth:
  jwt_expiry_seconds: 86400
  refresh_expiry_seconds: 2592000
  metrics_auth: true
  swagger_auth: true

security:
  rate_limit_per_min: 60
  rate_burst: 10
  cors_origins: []

monitoring:
  audit_verify_interval_secs: 300

# Purpose mapping (inline or file reference)
# purposes_file: "purpose_map.yaml"
purposes:
  financial_query:
    scope:
      - query_result
    capsule_env: AEGIS_FINANCIAL_QUERY_CAPSULE

# Policy configuration
policy:
  threat:
    max_open_capsules: 3
  audit:
    chain_verify: true

# RBAC configuration
rbac:
  roles:
    aegis_admin: Admin
  vendor_allow: []
  tenants: {}

# GDPR compliance (disabled by default)
gdpr:
  enabled: false
  erasure_confirm_delay_secs: 3600
  dsar_expiry_hours: 72
