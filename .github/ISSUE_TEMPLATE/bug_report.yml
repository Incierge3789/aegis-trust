name: Bug report
description: Report a defect in aegis-trust (Python or Node SDK)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not use this form for security
        vulnerabilities** — follow [SECURITY.md](../blob/main/SECURITY.md) and
        report privately instead.
  - type: dropdown
    id: sdk
    attributes:
      label: Which SDK?
      options:
        - Python (pip install aegis-trust)
        - TypeScript / Node (npm install aegis-trust)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show aegis-trust` or `npm ls aegis-trust`
      placeholder: "0.9.0-rc8"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal, self-contained example that reproduces the bug.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python/Node version, mode (LITE / FULL / AUTO).
    validations:
      required: false
