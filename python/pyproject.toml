[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-trust"
version = "0.9.3"
description = "AI agent data access control — control what agents can see"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Incierge", email = "contact@aegisagentcontrol.com" },
]
keywords = [
    "ai",
    "agent",
    "security",
    "privacy",
    "trust",
    "scope",
    "purpose",
    "mcp",
    "data-access",
    "field-level",
    "decorator",
    "minimum-disclosure",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: Pytest",
    "Typing :: Typed",
]
# LITE in-process filtering (the quickstart `@shield` path) is dependency-free:
# `pip install aegis-trust` pulls nothing. The gateway/FULL deps (httpx, attrs)
# moved to the `full` extra below — install them only to connect a gateway.
dependencies = []

[project.scripts]
aegis = "aegis_trust.cli:cli_entry"
# The MCP process-boundary proxy: point any MCP host (Claude Code, Cursor,
# codex, agy, ...) at this instead of the raw server and every tool result is
# minimized by policy before the agent's model sees it (host unmodified). The
# proxy already self-identifies as `aegis-mcp-proxy`; wire it as a real command.
aegis-mcp-proxy = "aegis_trust.mcp_proxy:main"

[project.urls]
Homepage = "https://github.com/Incierge3789/aegis-trust"
Repository = "https://github.com/Incierge3789/aegis-trust"
Documentation = "https://github.com/Incierge3789/aegis-trust#readme"
Issues = "https://github.com/Incierge3789/aegis-trust/issues"
Changelog = "https://github.com/Incierge3789/aegis-trust/blob/main/python/CHANGELOG.md"

# Commercial inquiries: contact@aegisagentcontrol.com
# Patent licensing: contact@aegisagentcontrol.com

[project.optional-dependencies]
# FULL / gateway mode: AegisClient → aegis-core REST + the generated client.
# LITE in-process filtering needs none of this, so it is opt-in.
#   pip install 'aegis-trust[full]'
full = [
    "httpx>=0.23,<1.0",
    "attrs>=22.2,<27.0",
]
yaml = [
    "pyyaml>=6.0",
]
# Real ORM/validation frameworks @shield claims to convert (README "Works with"
# section). Installed in the canonical test env so S018's real-dependency
# conversion-failure leak tests exercise the genuine library code paths
# (pydantic v2 model_dump, pydantic.v1 .dict, SQLAlchemy __table__ walk) —
# not just duck-typed simulations.
frameworks = [
    "pydantic>=2",
    "sqlalchemy>=2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.8",
    "pyyaml>=6.0",
    "pip-audit>=2.7",
    "pydantic>=2",
    "sqlalchemy>=2",
    # canonical contract v0: schema harness must run (not skip) in CI
    "jsonschema>=4.21",
    # FULL/gateway extra is now opt-in (not a core dep); CI still exercises the
    # client + generated-client + FULL-mode tests, so pull it explicitly here.
    "httpx>=0.23,<1.0",
    "attrs>=22.2,<27.0",
]

[project.entry-points."pytest11"]
aegis = "aegis_trust.pytest_plugin"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require external services or long-running CI scripts",
]

[tool.mypy]
# Type-safety gate runs `mypy --strict .` from package
# root. Scope the strict check to hand-written sources (src/aegis_trust). The
# _generated/ OpenAPI client is auto-generated and exempt from hand-typing
# standards; examples/, tests/, scripts/, docs/ are not publish artifact.
files = ["src/aegis_trust"]
exclude = [
    '^src/aegis_trust/_generated/.*$',
    '^src/aegis/.*$',  # legacy shim that re-exports aegis_trust; types live there
    '^examples/.*$',
    '^tests/.*$',
    '^scripts/.*$',
    '^docs/.*$',
    '^\\.release-venv/.*$',
    '^\\.venv/.*$',
    '^build/.*$',
    '^dist/.*$',
]
# Third-party deps without authored stubs (attrs is OpenAPI client gen dep);
# the runtime install ships PEP 561 inline types but mypy --strict from the
# repo root may not see the install env.
ignore_missing_imports = true
# Pre-existing tech debt — type narrowing in shield.py + config.py + cli.py.
# These error codes flag legitimate type smells (Optional → required arg)
# that pre-date the productization gate. Tightening is queued for a
# dedicated sprint; in the interim allow current strict-vs-codebase to
# baseline at clean by disabling these specific codes only on this package.
# Documented exemption per F-005 (no silent bypass; explicit, audit-visible).
disable_error_code = [
    "arg-type",          # Optional → required arg narrowing (shield.py:852-856 pattern)
    "no-any-return",     # config.py:155, history.py: Any escaping declared returns
    "no-untyped-def",    # 3 internal helpers without annotations
    "attr-defined",      # 2 attribute resolution narrowings
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_trust", "src/aegis"]
force-include = { "llms.txt" = "aegis_trust/llms.txt" }

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/llms.txt",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/AGENTS.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/VERSION",
]

[tool.uv]
# Security: force the transitive msgpack (via cachecontrol) to the patched
# release. msgpack 1.1.2 has GHSA-6v7p-g79w-8964 (fixed in 1.2.1); it is a
# dev/CI-tool transitive dep (not used by the aegis-trust runtime). Pin to clear
# the pip-audit fail-closed gate.
override-dependencies = ["msgpack>=1.2.1"]
